<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti 💖</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffdde1;
            overflow: hidden;
            flex-direction: column;
        }
        .container {
            text-align: center;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.5s;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .card:hover {
            transform: scale(1.1);
        }
        .hidden-message {
            display: none;
            margin-top: 10px;
            font-size: 18px;
            color: #e91e63;
        }
        .button {
            padding: 10px 20px;
            background-color: #e91e63;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        .button:hover {
            background-color: #c2185b;
        }
        .heart {
            position: absolute;
            color: red;
            font-size: 20px;
            animation: floatUp 3s infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Para Mi Amor 💕</h2>
            <p>Haz clic en el botón para ver un mensaje especial</p>
            <p class="hidden-message" id="daily-message"></p>
        </div>
        <button class="button" onclick="showRandomMessage()">Cambiar Frase</button>
    </div>

    <script>
        const messages = [
            "Eres mi razón de sonreír 😊❤️",
            "Cada día a tu lado es un regalo 🎁💖",
            "Te quiero más de lo que las palabras pueden decir 😘💕",
            "Eres la estrella que ilumina mi camino ✨🥰",
            "Contigo, cada momento es mágico 💫💞",
            "Eres lo mejor que me ha pasado en la vida 💘🥰",
            "Quererte es mi aventura favorita 🚀💖",
            "Eres mi rincón favorito del mundo 🌍❤️",
            "Cada latido de mi corazón lleva tu nombre 💓✨",
            "Si tuviera que elegir de nuevo, siempre serías tú 💖🌟",
            "Tu amor es la melodía más hermosa en mi vida 🎶💕",
            "No necesito un cuento de hadas, te tengo a ti ✨💍",
            "Contigo, cada día es un nuevo capítulo de amor 📖❤️",
            "Eres el sueño que nunca quiero dejar de soñar 💭💘",
            "Mi felicidad empieza con tu sonrisa 😊💖",
            "Te quiero no solo por cómo eres, sino por cómo me haces sentir 🥰💕",
            "Tenerte en mi vida es mi mayor bendición 🙏❤️",
            "Mi lugar favorito es a tu lado 💑💖",
            "Cada beso tuyo es un pedacito de cielo 😘✨",
            "No hay mejor manera de empezar el día que con tu amor ☀️💞",
            "Eres el mejor regalo que la vida me ha dado 🎁💘",
            "Amo cada pequeño detalle que te hace ser tú 😍💕",
            "No hay distancia que pueda separar lo que sentimos 🌍💖",
            "Eres mi refugio, mi paz, mi amor infinito 🏡💞",
            "Contigo, todo tiene más sentido 💫💘",
            "Te quiero más de lo que jamás podré explicar en palabras ❤️✨"
        ];
        
        function showRandomMessage() {
            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById('daily-message').textContent = messages[randomIndex];
            document.querySelector('.hidden-message').style.display = 'block';
        }
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            document.body.appendChild(heart);
            
            let x = Math.random() * window.innerWidth;
            let y = window.innerHeight;
            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;
            
            setTimeout(() => {
                heart.remove();
            }, 3000);
        }
        setInterval(createHeart, 500);
    </script>
</body>
</html>
